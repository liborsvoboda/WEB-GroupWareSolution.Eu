<div class="login-box">
    <div class="card card-outline card-primary">
        <div class="card-header text-center">
            <a href="../../index2.html" class="h2"><b>{{ $t("labels.company") }}</b>{{ $t("labels.lte")}}</a>
        </div>
        <div class="card-body">
            <p class="login-box-msg">
                {{ $t("messages.retrieveNewPassword") }}
            </p>
            <form>
                <div class="input-group mb-3">
                    <input type="email" class="form-control" :placeholder="$t('labels.email')" maxlength="255" autocomplete="off" v-model="email" :class="{ wrongInput: v$.email.$invalid }" v-on:input="validations()" />
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-envelope"></span>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <button type="button" v-on:click="resetPassword" class="btn btn-primary btn-block" :disabled="v$.$invalid">
                            {{ $t("buttons.requestNewPassword") }}
                        </button>
                    </div>
                    <!-- /.col -->
                </div>
            </form>
            <p class="mt-3 mb-1">
                <router-link to="/login">{{ $t("labels.login") }}</router-link>
            </p>
        </div>
        <!-- /.login-card-body -->
    </div>
</div>
<!-- /.login-box -->
