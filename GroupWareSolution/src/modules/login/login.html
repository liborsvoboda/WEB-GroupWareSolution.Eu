<div class="login-box">
    <div class="card card-outline card-primary">
        <div class="card-header text-center">
            <router-link to="/" class="h2">
                <b>{{ $t("labels.company") }}</b>{{ $t("labels.lte")}}
            </router-link>
        </div>
        <div class="card-body">
            <p class="login-box-msg">{{ $t("labels.signInToStart") }}</p>

            <form @submit.prevent="loginByAuth('auth')">
                <div class="input-group mb-3">
                    <input class="form-control" type="email" :placeholder="$t('labels.email')" maxlength="255" autocomplete="off" v-model="email" :class="{ wrongInput: v$.email.$invalid }" v-on:input="validations()" />
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-envelope"></span>
                        </div>
                    </div>
                </div>
                <div class="input-group mb-3">
                    <input class="form-control" type="password" :placeholder="$t('labels.password')" v-model="password" :class="{ wrongInput: v$.password.$invalid }" v-on:input="validations()" />
                    <div class="input-group-append">
                        <div class="input-group-text">
                            <span class="fas fa-lock"></span>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-7">
                        <app-checkbox type="icheck" v-model="rememberMe">
                            {{ $t("labels.rememberMe") }}
                        </app-checkbox>
                    </div>
                    <div class="col-5">
                        <app-button class="btn-primary" type="submit" block="true" :loading="isAuthLoading" :disabled="isFacebookLoading || isGoogleLoading || v$.$invalid">
                            {{ $t("labels.signIn") }}
                        </app-button>
                    </div>
                </div>
            </form>

            <div class="social-auth-links text-center mt-2 mb-3">
                <!--<app-button class="btn-primary" icon="facebook" block="true" @click="loginByFacebook" :loading="isFacebookLoading" :disabled="isAuthLoading || isGoogleLoading">
                    {{ $t("labels.signInUsingFB") }}
                </app-button>
                <app-button class="btn-danger" icon="google-plus" block="true" @click="loginByGoogle" :loading="isGoogleLoading" :disabled="isAuthLoading || isFacebookLoading">
                    {{ $t("labels.SignInUsingGoogle") }}
                </app-button>-->
            </div>

            <p class="mb-1">
                <router-link to="/forgotpassword">
                    {{ $t("labels.forgotPassword") }}
                </router-link>
            </p>
            <p class="mb-0">
                <router-link to="/register" class="text-center">
                    {{ $t("labels.registerMembership") }}
                </router-link>
            </p>
        </div>
        <!-- /.card-body -->
    </div>
    <!-- /.card -->
</div>
