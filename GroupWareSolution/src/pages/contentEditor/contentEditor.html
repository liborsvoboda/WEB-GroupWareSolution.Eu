<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>{{$t("labels.contentEditor")}}</h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><router-link to="/">{{$t("labels.home")}}</router-link></li>
                    <li class="breadcrumb-item active">{{$t("labels.contentEditor")}}</li>
                </ol>
            </div>
        </div>
    </div>
</section>

<section class="content">
    <div class="container-fluid">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title" style="display: contents;">
                    {{$t("labels.selectMenu")}}:
                    <span>
                        <app-select class="mt-3"
                                    v-model="selectedMenu"
                                    :options="menuList"
                                    type="custom"
                                    @change="loadMenu">
                        </app-select>
                    </span>
                </h3>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>{{$t("languages.czech")}}</label>
                    <div id="summernoteCz">{{contentCZ}}</div>
                </div>

                <div class="form-group">
                    <label>{{$t("languages.english")}}</label>
                    <div id="summernoteEn">{{contentEN}}</div>
                </div>
            </div>

                <div class="card-footer">
                    <button v-on:click="save()" :disabled="(!saveEnabled)" class="btn btn-primary btn-flat">{{ $t("labels.save") }}</button>
                </div>
            </div>
    </div>
</section>
