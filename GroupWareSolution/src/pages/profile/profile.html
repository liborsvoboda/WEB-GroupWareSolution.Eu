<section class="content-header">
    <div class="container-fluid">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1>{{ $t("labels.profile") }}</h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item">
                        <router-link to="/">{{ $t("labels.home") }}</router-link>
                    </li>
                    <li class="breadcrumb-item active">{{ $t("labels.userProfile") }}</li>
                </ol>
            </div>
        </div>
    </div>
</section>

<!-- Main content -->
<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3">
                <!-- Profile Image -->
                <div class="card card-primary card-outline">
                    <div class="card-body box-profile">
                        <div class="text-center">
                            <img class="profile-user-img img-fluid img-circle" :src="(user && user.picture) ? user.picture : require('@/assets/img/default-profile.png')" />
                        </div>

                        <h3 class="profile-username text-center">
                            {{ user.name +' '+ user.surname}}
                        </h3>
                        <h5 class="text-muted text-center">{{ $t("labels.address") }}</h5>

                        <div class="text-muted text-center" v-if="(user.companyName != null)">{{user.companyName}}</div>
                        <div class="text-muted text-center" v-if="(user.street != null)">{{user.street}}</div>
                        <div class="text-muted text-center" v-if="(user.city != null)">{{user.postcode}} {{user.city}} </div>

                        <br /><br />
                        <h5 class="text-muted text-center">{{ $t("labels.contacts") }}</h5>
                        <div class="text-muted text-center" v-if="(user.email != null)">{{user.email}}</div>
                        <div class="text-muted text-center" v-if="(user.phone != null)">{{user.phone}}</div>
                        <!--<ul class="list-group list-group-unbordered mb-3">
        <li class="list-group-item">
            <b>Followers</b>
            <a class="float-right">1,322</a>
        </li>
        <li class="list-group-item">
            <b>Following</b> <a class="float-right">543</a>
        </li>
    </ul>-->
                    </div>
                </div>
            </div>
            <!-- /.col -->
            <div class="col-md-9">
                <div class="card">
                    <div class="card-header p-2">
                        <ul class="nav nav-pills">
                            <!--<li class="nav-item">
                                <button
                                    class="nav-link"
                                    :class="{'active' : activeTab === 'TIMELINE'}"
                                    @click="setActiveTab('TIMELINE')"
                                >
                                    Timeline
                                </button>
                            </li>-->
                            <li class="nav-item">
                                <button class="nav-link active" >
                                    {{ $t("labels.yourProfile") }}
                                </button>
                            </li>
                        </ul>
                    </div>
                    <!-- /.card-header -->
                    <div class="card-body">
                        <div class="tab-content">
                            <div class="tab-pane active" >
                                <form class="form-horizontal">
                                    <div class="form-group row">
                                        <label for="name" class="col-sm-2 col-form-label">{{ $t("labels.companyName") }}</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" v-model="inputUser.companyName" maxlength="255" />
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="name" class="col-sm-2 col-form-label">{{ $t("labels.name") }}</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" v-model="inputUser.name" maxlength="50" />
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="name" class="col-sm-2 col-form-label">{{ $t("labels.surname") }}</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" v-model="inputUser.surname" maxlength="50" />
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="name" class="col-sm-2 col-form-label">{{ $t("labels.street") }}</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" v-model="inputUser.street" maxlength="255" />
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="name" class="col-sm-2 col-form-label">{{ $t("labels.city") }}</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" v-model="inputUser.city" maxlength="150" />
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="name" class="col-sm-2 col-form-label">{{ $t("labels.postcode") }}</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" v-model="inputUser.postcode" maxlength="10" />
                                        </div>
                                    </div>
                                    <br />
                                    <div class="form-group row">
                                        <label for="name" class="col-sm-2 col-form-label">{{ $t("labels.email") }}</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" v-model="inputUser.email" maxlength="255" :disabled="true" />
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="name" class="col-sm-2 col-form-label">{{ $t("labels.phone") }}</label>
                                        <div class="col-sm-10">
                                            <input type="text" class="form-control" v-model="inputUser.phone" maxlength="20" />
                                        </div>
                                    </div>
                                    <div class="form-group row">
                                        <label for="name" class="col-sm-2 col-form-label">{{ $t("labels.profilePhoto") }}</label>
                                        <div class="col-sm-10">
                                            <input type="file" @change="loadTextFromFile" accept="image/x-png,image/gif,image/jpeg">
                                        </div>
                                    </div>

                                    <div class="form-group row">
                                        <div class="offset-sm-2 col-sm-10">
                                            <div class="checkbox">
                                                <label>
                                                    <input type="checkbox" v-model="inputUser.agreeTerms" :disabled="inputUser.agreeTerms" /> I
                                                    agree to the
                                                    <a href="/terms">terms and conditions</a>
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="form-group row">
                                        <div class="offset-sm-2 col-sm-10">
                                            <button type="button"
                                                    class="btn btn-danger" v-on:click="updateProfile()">
                                                {{ $t("labels.save") }}
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
